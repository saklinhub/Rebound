server:
  port: 8080

spring:
  application:
    name: revenue-recovery-agent
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:recovery_db}
    username: ${POSTGRES_USER:recovery_user}
    password: ${POSTGRES_PASSWORD:recovery_pass}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

gemini:
  api:
    url: https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-pro:generateContent
    timeout-seconds: 30
    max-retries: 2

agent:
  batch-size: 5
  batch-delay-ms: 800
  max-concurrent-workflows: 4

logging:
  level:
    com.razorpay: DEBUG
